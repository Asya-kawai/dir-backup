name: ShellCheck

on:
  push:
    paths:
      - 'dir_backup.sh'
  pull_request:
    paths:
      - 'dir_backup.sh'

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@v2
        with:
          scandir: '.'
          check_together: true
